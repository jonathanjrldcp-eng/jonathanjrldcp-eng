name: Atualizar Snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-snake
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar animações
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jonathanjrldcp-eng
          outputs: |
            dist/snake.svg?color_snake=#334155&color_dots=#f1f5f9,#cbd5e1,#94a3b8,#64748b,#475569
            dist/snake-dark.svg?palette=github-dark&color_snake=#e2e8f0&color_dots=#161b22,#253347,#334155,#64748b,#94a3b8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar animações
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: Atualizar animações do Snake
